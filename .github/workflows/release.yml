name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Run tests
      run: go test -v ./...

    - name: Build binaries
      run: |
        # Linux amd64
        GOOS=linux GOARCH=amd64 go build -o plansm-linux-amd64 -ldflags="-s -w" ./cmd/plansm

        # Linux arm64
        GOOS=linux GOARCH=arm64 go build -o plansm-linux-arm64 -ldflags="-s -w" ./cmd/plansm

        # macOS amd64
        GOOS=darwin GOARCH=amd64 go build -o plansm-darwin-amd64 -ldflags="-s -w" ./cmd/plansm

        # macOS arm64
        GOOS=darwin GOARCH=arm64 go build -o plansm-darwin-arm64 -ldflags="-s -w" ./cmd/plansm

        # Windows amd64
        GOOS=windows GOARCH=amd64 go build -o plansm-windows-amd64.exe -ldflags="-s -w" ./cmd/plansm

        # Windows arm64
        GOOS=windows GOARCH=arm64 go build -o plansm-windows-arm64.exe -ldflags="-s -w" ./cmd/plansm

    - name: Generate checksums
      run: |
        sha256sum plansm-* > checksums.txt
        cat checksums.txt

    - name: Extract release notes
      id: extract-release-notes
      run: |
        # Try to extract release notes from CHANGELOG.md if it exists
        if [ -f CHANGELOG.md ]; then
          awk '/^## / {if (p) exit; if ($2 == "'${GITHUB_REF#refs/tags/}'") p=1; next} p' CHANGELOG.md > release-notes.txt
        else
          echo "Release ${GITHUB_REF#refs/tags/}" > release-notes.txt
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        body_path: release-notes.txt
        files: |
          plansm-linux-amd64
          plansm-linux-arm64
          plansm-darwin-amd64
          plansm-darwin-arm64
          plansm-windows-amd64.exe
          plansm-windows-arm64.exe
          checksums.txt
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
