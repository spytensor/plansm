name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install jq
      run: sudo apt-get update && sudo apt-get install -y jq

    - name: Run verification tests
      run: |
        bash skills/plansm/scripts/verify.sh --help
        bash skills/plansm/scripts/fsm.sh status
        test -f skills/plansm/SKILL.md

    - name: Package skill
      run: |
        # Create release package
        tar -czf plansm-skill.tar.gz skills/plansm/
        zip -r plansm-skill.zip skills/plansm/

        # Generate checksums
        sha256sum plansm-skill.tar.gz plansm-skill.zip > checksums.txt
        cat checksums.txt

    - name: Extract release notes
      id: extract-release-notes
      run: |
        # Try to extract release notes from CHANGELOG.md if it exists
        if [ -f CHANGELOG.md ]; then
          awk '/^## / {if (p) exit; if ($2 == "'${GITHUB_REF#refs/tags/}'") p=1; next} p' CHANGELOG.md > release-notes.txt
        else
          echo "Release ${GITHUB_REF#refs/tags/}" > release-notes.txt
          echo "" >> release-notes.txt
          echo "## Installation" >> release-notes.txt
          echo "" >> release-notes.txt
          echo "\`\`\`bash" >> release-notes.txt
          echo "# Download and extract" >> release-notes.txt
          echo "wget https://github.com/spytensor/plansm/releases/download/${GITHUB_REF#refs/tags/}/plansm-skill.tar.gz" >> release-notes.txt
          echo "tar -xzf plansm-skill.tar.gz" >> release-notes.txt
          echo "" >> release-notes.txt
          echo "# Copy to Claude Code skills directory" >> release-notes.txt
          echo "cp -r skills/plansm ~/.claude/skills/" >> release-notes.txt
          echo "\`\`\`" >> release-notes.txt
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        body_path: release-notes.txt
        files: |
          plansm-skill.tar.gz
          plansm-skill.zip
          checksums.txt
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
