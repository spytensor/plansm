name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Skill
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install jq
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          sudo apt-get update && sudo apt-get install -y jq
        elif [ "$RUNNER_OS" == "macOS" ]; then
          brew install jq
        fi

    - name: Test verification scripts
      run: |
        bash skills/plansm/scripts/verify.sh --help
        bash skills/plansm/scripts/fsm.sh status
        bash skills/plansm/scripts/parse-plan.sh plan.json version

    - name: Verify current plan step
      run: |
        bash skills/plansm/scripts/verify.sh --current

    - name: Check skill structure
      run: |
        test -f skills/plansm/SKILL.md
        test -d skills/plansm/scripts
        test -d skills/plansm/references
        test -d skills/plansm/templates
        test -f skills/plansm/templates/plan-template.json

    - name: Validate plan.json schema
      run: |
        jq empty plan.json
        jq -e '.version' plan.json
        jq -e '.current_step' plan.json
        jq -e '.steps | length > 0' plan.json
