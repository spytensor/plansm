name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.21', '1.22', '1.23']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - name: Verify go.mod
      run: go mod verify

    - name: Build
      run: go build -v ./cmd/plansm

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Upload coverage
      if: matrix.os == 'ubuntu-latest' && matrix.go == '1.23'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella

    - name: Run go vet
      run: go vet ./...

    - name: Run staticcheck
      uses: dominikh/staticcheck-action@v1
      with:
        version: "latest"
        install-go: false

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Build
      run: go build -o plansm ./cmd/plansm

    - name: Test init command
      run: |
        mkdir -p /tmp/test-plansm
        cd /tmp/test-plansm
        $GITHUB_WORKSPACE/plansm init
        test -f plan.json
        cat plan.json

    - name: Test init with Claude
      run: |
        mkdir -p /tmp/test-plansm-claude
        cd /tmp/test-plansm-claude
        $GITHUB_WORKSPACE/plansm init --claude
        test -f plan.json
        test -d .claude/commands
        test -f .claude/commands/pwork.md
        test -f .claude/commands/pverify.md
        test -d .claude-plugin
        test -f .claude-plugin/plugin.json

    - name: Test verify and advance workflow
      run: |
        cd /tmp/test-plansm
        $GITHUB_WORKSPACE/plansm status
        $GITHUB_WORKSPACE/plansm current
        $GITHUB_WORKSPACE/plansm verify --current
        $GITHUB_WORKSPACE/plansm advance
        $GITHUB_WORKSPACE/plansm status

    - name: Test doctor command
      run: |
        cd /tmp/test-plansm-claude
        $GITHUB_WORKSPACE/plansm doctor

    - name: Test JSON output
      run: |
        cd /tmp/test-plansm
        $GITHUB_WORKSPACE/plansm current --json
        $GITHUB_WORKSPACE/plansm verify --current --json

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v4
      with:
        version: latest
        args: --timeout=5m
